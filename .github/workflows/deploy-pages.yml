name: Frontend auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: client
        run: npm install

      - name: Frontend bauen
        working-directory: client
        # VITE_API_URL muss als Repository-Secret hinterlegt sein und zeigt
        # auf das online gehostete Backend (z.B. https://xyz.onrender.com)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build -- --outDir dist --emptyOutDir

      - name: Für GitHub Pages vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
